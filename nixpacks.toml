[providers]
providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs_20", "openssl"]

[phases.install]
cmds = [
  "cd server && npm install"
]

[phases.build]
cmds = [
  "cd server && npx prisma generate",
  "cd server && npm run build"
]

[start]
cmd = "cd server && npx prisma migrate deploy && npm run start"
