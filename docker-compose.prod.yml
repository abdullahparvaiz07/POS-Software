version: '3.8'

services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    image: restaurant-pos-client:v1.0.0
    container_name: pos_client_prod
    restart: unless-stopped
    networks:
      - restaurant-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: restaurant-pos-api:v1.0.0
    container_name: pos_server_prod
    restart: unless-stopped
    command: ["npm", "start"]
    env_file:
      - .env
    volumes:
      - logs:/app/logs
      - backups:/app/backups
    networks:
      - restaurant-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: restaurant-pos-worker:v1.0.0
    container_name: pos_worker_prod
    restart: unless-stopped
    command: ["npm", "run", "start:worker"]
    env_file:
      - .env
    volumes:
      - logs:/app/logs
      - backups:/app/backups
    networks:
      - restaurant-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: pos_mysql_prod
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - restaurant-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: pos_redis_prod
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - restaurant-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: pos_nginx_prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - uploads:/var/www/uploads
    networks:
      - restaurant-network
    depends_on:
      - client
      - server

volumes:
  mysql-data:
  redis-data:
  uploads:
  logs:
  backups:

networks:
  restaurant-network:
    driver: bridge
