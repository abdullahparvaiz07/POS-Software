services:
  # 1. Backend Web Service (Docker)
  - type: web
    name: restaurant-pos-server
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: "5000"
      - key: NODE_ENV
        value: "production"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: redis
          name: restaurant-pos-redis
          property: connectionString

  # 2. Frontend Static Site (React Vite)
  - type: web
    name: restaurant-pos-client
    runtime: static
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: ./client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: restaurant-pos-server
          property: url
          postfix: /api/v1

  # 3. Redis Key-Value Store
  - type: redis
    name: restaurant-pos-redis
    plan: free
    ipAllowList: []
